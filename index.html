<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS - SD Negeri Seda - Sakti</title>
  <!-- Tailwind CSS & SweetAlert2 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-xl">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Learning Managemen System (LMS)</h1>
      <p class="text-sm text-gray-500">SD Negeri Seda - Sakti</p>
    </div>

    <!-- Section 1: Form Login -->
    <div id="loginSection" class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Login Siswa</h2>
      <div>
        <label class="block text-sm font-medium text-gray-600">NIS</label>
        <input type="text" id="nisInput" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="passInput" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold">Masuk</button>
    </div>

    <!-- Section 2: Pilih Mapel -->
    <div id="mapelSection" class="hidden space-y-4">
      <div class="bg-blue-50 p-3 rounded-lg flex justify-between items-center">
        <div>
          <p id="userName" class="font-bold text-gray-800"></p>
          <p id="userKelas" class="text-xs text-gray-600"></p>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500 text-white px-2 py-1 rounded">Keluar</button>
      </div>

      <h2 class="text-lg font-semibold text-gray-700">Pilih Mata Pelajaran</h2>
      <select id="mapelSelect" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <option value="">-- Pilih Mapel --</option>
      </select>
      <button onclick="startUjian()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold">Mulai Ujian</button>
    </div>

    <!-- Section 3: Lembar Ujian (Satu Soal Per Halaman) -->
    <div id="ujianSection" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 id="currentMapel" class="font-bold text-gray-700"></h2>
        <span id="soalCounter" class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium"></span>
      </div>

      <!-- Wadah Soal Tunggal -->
      <div id="soalContainer" class="space-y-4 min-h-[180px]">
        <!-- Render soal aktif lewat JavaScript -->
      </div>

      <!-- Navigasi Soal -->
      <div class="flex justify-between items-center pt-4 border-t">
        <button id="btnPrev" onclick="prevSoal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg font-semibold text-sm disabled:opacity-50" disabled>Sebelumnya</button>
        <button id="btnNext" onclick="nextSoal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold text-sm">Selanjutnya</button>
      </div>

      <button id="btnSubmit" onclick="confirmSubmit()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold hidden">Kirim Jawaban Akhir</button>
    </div>
  </div>

  <script>
    // MASUKKAN URL DEPLOYMENT APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbxAzzgDiPXgk-5a0yfxvmVIaejwDsRUrpqDPiInFl4tIYqnnIof_P3r5_AnKr6SgSXE5w/exec";

    let currentUser = null;
    let listSoal = [];
    let selectedMapel = "";
    let currentIndex = 0;
    let jawabanSiswa = {}; // Menyimpan pilihan jawaban per id soal

    async function fetchAPI(payload) {
      Swal.showLoading();
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        Swal.close();
        return data;
      } catch (err) {
        Swal.fire("Error", "Gagal terhubung ke server", "error");
        return null;
      }
    }

    async function login() {
      const nis = document.getElementById("nisInput").value;
      const pass = document.getElementById("passInput").value;

      if (!nis || !pass) return Swal.fire("Peringatan", "Lengkapi NIS dan Password!", "warning");

      const res = await fetchAPI({ action: "login", nis: nis, password: pass });
      if (res && res.status === "success") {
        currentUser = res.user;
        document.getElementById("userName").innerText = currentUser.nama;
        document.getElementById("userKelas").innerText = "Kelas: " + currentUser.kelas;
        
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("mapelSection").classList.remove("hidden");
        
        loadMapel();
      } else {
        Swal.fire("Gagal Login", res ? res.message : "Terjadi kesalahan", "error");
      }
    }

    async function loadMapel() {
      const res = await fetchAPI({ action: "getMapel" });
      if (res && res.status === "success") {
        const select = document.getElementById("mapelSelect");
        select.innerHTML = '<option value="">-- Pilih Mapel --</option>';
        res.mapelList.forEach(m => {
          select.innerHTML += `<option value="${m}">${m}</option>`;
        });
      }
    }

    async function startUjian() {
      selectedMapel = document.getElementById("mapelSelect").value;
      if (!selectedMapel) return Swal.fire("Peringatan", "Pilih mata pelajaran terlebih dahulu!", "warning");

      const res = await fetchAPI({ action: "getSoal", mapel: selectedMapel });
      if (res && res.status === "success" && res.soal.length > 0) {
        listSoal = res.soal;
        currentIndex = 0;
        jawabanSiswa = {};
        
        document.getElementById("mapelSection").classList.add("hidden");
        document.getElementById("ujianSection").classList.remove("hidden");
        renderSoal();
      } else {
        Swal.fire("Informasi", "Belum ada soal untuk mata pelajaran ini", "info");
      }
    }

    function renderSoal() {
      document.getElementById("currentMapel").innerText = selectedMapel;
      document.getElementById("soalCounter").innerText = `Soal ${currentIndex + 1} dari ${listSoal.length}`;
      
      const s = listSoal[currentIndex];
      const container = document.getElementById("soalContainer");
      const currentSelected = jawabanSiswa[s.id] || "";

      container.innerHTML = `
        <div class="border p-4 rounded-lg space-y-4 bg-gray-50 shadow-sm">
          <p class="font-medium text-gray-800 text-base leading-relaxed">${currentIndex + 1}. ${s.pertanyaan}</p>
          <div class="space-y-2 pl-2">
            ${['A', 'B', 'C', 'D'].map(opt => `
              <label class="flex items-center space-x-3 text-sm text-gray-700 cursor-pointer p-2 rounded hover:bg-gray-100 transition">
                <input type="radio" name="soal_aktif" value="${opt}" ${currentSelected === opt ? 'checked' : ''} onchange="simpanJawaban('${s.id}', '${opt}')" class="text-blue-600 w-4 h-4">
                <span class="text-base"><b>${opt}.</b> ${s['op_' + opt.toLowerCase()]}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `;

      // Atur status tombol navigasi
      const btnPrev = document.getElementById("btnPrev");
      const btnNext = document.getElementById("btnNext");
      const btnSubmit = document.getElementById("btnSubmit");

      btnPrev.disabled = currentIndex === 0;

      if (currentIndex === listSoal.length - 1) {
        btnNext.classList.add("hidden");
        btnSubmit.classList.remove("hidden");
      } else {
        btnNext.classList.remove("hidden");
        btnSubmit.classList.add("hidden");
      }
    }

    function simpanJawaban(soalId, pilihan) {
      jawabanSiswa[soalId] = pilihan;
    }

    function nextSoal() {
      if (currentIndex < listSoal.length - 1) {
        currentIndex++;
        renderSoal();
      }
    }

    function prevSoal() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSoal();
      }
    }

    function confirmSubmit() {
      const terjawab = Object.keys(jawabanSiswa).length;
      const belumTerjawab = listSoal.length - terjawab;

      let warningText = "Pastikan semua jawaban sudah diperiksa.";
      if (belumTerjawab > 0) {
        warningText = `Perhatian: Masih ada ${belumTerjawab} soal yang belum Anda jawab!`;
      }

      Swal.fire({
        title: "Kirim Jawaban Ujian?",
        text: warningText,
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Ya, Kirim",
        cancelButtonText: "Periksa Lagi"
      }).then((result) => {
        if (result.isConfirmed) submitUjian();
      });
    }

    async function submitUjian() {
      const payload = {
        action: "submitUjian",
        user: currentUser,
        mapel: selectedMapel,
        jawaban: jawabanSiswa
      };

      const res = await fetchAPI(payload);
      if (res && res.status === "success") {
        Swal.fire({
          title: "Ujian Selesai!",
          html: `Nilai Anda: <b>${res.nilai}</b><br>Jawaban Benar: ${res.benar} dari ${res.total} soal.`,
          icon: "success"
        }).then(() => {
          location.reload();
        });
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
