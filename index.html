<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem TKA Kelas 6</title>
  <!-- Tailwind CSS & SweetAlert2 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-xl">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">TKA Berbasis Komputer</h1>
      <p class="text-sm text-gray-500">Kelas 6 SD</p>
    </div>

    <!-- Section 1: Form Login -->
    <div id="loginSection" class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Login Siswa</h2>
      <div>
        <label class="block text-sm font-medium text-gray-600">NIS</label>
        <input type="text" id="nisInput" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="passInput" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold">Masuk</button>
    </div>

    <!-- Section 2: Pilih Mapel -->
    <div id="mapelSection" class="hidden space-y-4">
      <div class="bg-blue-50 p-3 rounded-lg flex justify-between items-center">
        <div>
          <p id="userName" class="font-bold text-gray-800"></p>
          <p id="userKelas" class="text-xs text-gray-600"></p>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500 text-white px-2 py-1 rounded">Keluar</button>
      </div>

      <h2 class="text-lg font-semibold text-gray-700">Pilih Mata Pelajaran</h2>
      <select id="mapelSelect" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <option value="">-- Pilih Mapel --</option>
      </select>
      <button onclick="startUjian()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold">Mulai Ujian</button>
    </div>

    <!-- Section 3: Lembar Ujian -->
    <div id="ujianSection" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 id="currentMapel" class="font-bold text-gray-700"></h2>
        <span id="soalCounter" class="text-sm bg-gray-200 px-2 py-1 rounded"></span>
      </div>

      <div id="soalContainer" class="space-y-4">
        <!-- Soal dimasukkan lewat JavaScript -->
      </div>

      <button onclick="confirmSubmit()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold">Kirim Jawaban</button>
    </div>
  </div>

  <script>
    // MASUKKAN URL DEPLOYMENT APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbxAzzgDiPXgk-5a0yfxvmVIaejwDsRUrpqDPiInFl4tIYqnnIof_P3r5_AnKr6SgSXE5w/exec";

    let currentUser = null;
    let listSoal = [];
    let selectedMapel = "";

    async function fetchAPI(payload) {
      Swal.showLoading();
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        Swal.close();
        return data;
      } catch (err) {
        Swal.fire("Error", "Gagal terhubung ke server", "error");
        return null;
      }
    }

    async function login() {
      const nis = document.getElementById("nisInput").value;
      const pass = document.getElementById("passInput").value;

      if (!nis || !pass) return Swal.fire("Peringatan", "Lengkapi NIS dan Password!", "warning");

      const res = await fetchAPI({ action: "login", nis: nis, password: pass });
      if (res && res.status === "success") {
        currentUser = res.user;
        document.getElementById("userName").innerText = currentUser.nama;
        document.getElementById("userKelas").innerText = "Kelas: " + currentUser.kelas;
        
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("mapelSection").classList.remove("hidden");
        
        loadMapel();
      } else {
        Swal.fire("Gagal Login", res ? res.message : "Terjadi kesalahan", "error");
      }
    }

    async function loadMapel() {
      const res = await fetchAPI({ action: "getMapel" });
      if (res && res.status === "success") {
        const select = document.getElementById("mapelSelect");
        select.innerHTML = '<option value="">-- Pilih Mapel --</option>';
        res.mapelList.forEach(m => {
          select.innerHTML += `<option value="${m}">${m}</option>`;
        });
      }
    }

    async function startUjian() {
      selectedMapel = document.getElementById("mapelSelect").value;
      if (!selectedMapel) return Swal.fire("Peringatan", "Pilih mata pelajaran terlebih dahulu!", "warning");

      const res = await fetchAPI({ action: "getSoal", mapel: selectedMapel });
      if (res && res.status === "success" && res.soal.length > 0) {
        listSoal = res.soal;
        renderSoal();
        document.getElementById("mapelSection").classList.add("hidden");
        document.getElementById("ujianSection").classList.remove("hidden");
      } else {
        Swal.fire("Informasi", "Belum ada soal untuk mata pelajaran ini", "info");
      }
    }

    function renderSoal() {
      document.getElementById("currentMapel").innerText = selectedMapel;
      document.getElementById("soalCounter").innerText = `${listSoal.length} Soal`;
      
      const container = document.getElementById("soalContainer");
      container.innerHTML = "";

      listSoal.forEach((s, idx) => {
        container.innerHTML += `
          <div class="border p-4 rounded-lg space-y-2 bg-gray-50">
            <p class="font-medium text-gray-800">${idx + 1}. ${s.pertanyaan}</p>
            <div class="space-y-1 pl-2">
              ${['A', 'B', 'C', 'D'].map(opt => `
                <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                  <input type="radio" name="soal_${s.id}" value="${opt}" class="text-blue-600">
                  <span><b>${opt}.</b> ${s['op_' + opt.toLowerCase()]}</span>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      });
    }

    function confirmSubmit() {
      Swal.fire({
        title: "Kirim Jawaban?",
        text: "Pastikan semua soal sudah terjawab dengan benar.",
        icon: "question",
        showCancelButton: true,
        confirmButtonText: "Ya, Kirim",
        cancelButtonText: "Batal"
      }).then((result) => {
        if (result.isConfirmed) submitUjian();
      });
    }

    async function submitUjian() {
      const jawaban = {};
      listSoal.forEach(s => {
        const selected = document.querySelector(`input[name="soal_${s.id}"]:checked`);
        if (selected) jawaban[s.id] = selected.value;
      });

      const payload = {
        action: "submitUjian",
        user: currentUser,
        mapel: selectedMapel,
        jawaban: jawaban
      };

      const res = await fetchAPI(payload);
      if (res && res.status === "success") {
        Swal.fire({
          title: "Ujian Selesai!",
          html: `Nilai Anda: <b>${res.nilai}</b><br>Jawaban Benar: ${res.benar} dari ${res.total} soal.`,
          icon: "success"
        }).then(() => {
          location.reload();
        });
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
